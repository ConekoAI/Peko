name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. peko create my-peko
        2. peko send my-peko "..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `peko version`, or the version in Peko Desktop's Settings.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The relevant lines of `~/.peko/logs/daemon.log`. Remove anything private first.
      render: text
