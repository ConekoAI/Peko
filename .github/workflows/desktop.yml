name: Desktop

# The desktop app (desktop/): frontend, Rust on Linux/Windows/macOS, the
# IPC contract against the runtime's fixtures, and a dependency audit.
# Runtime-only changes don't start it, and desktop-only changes don't start
# integration.yml. The `changes` job picks the jobs a pull request needs.

on:
  push:
    branches: [master, main]
    paths:
      - 'desktop/**'
      - 'peko-rs/core/src/ipc/fixtures/**'
      - 'peko-rs/protocol/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'desktop/**'
      - 'peko-rs/core/src/ipc/fixtures/**'
      - 'peko-rs/protocol/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'desktop/src/**'
              - 'desktop/src-tauri/**'
              - 'desktop/public/**'
              - 'desktop/scripts/**'
              - 'desktop/*.json'
              - 'desktop/*.ts'
              - 'desktop/*.html'
              - 'desktop/audit.toml'
              - 'desktop/.trivyignore'
              # The runtime's wire types the desktop's tests build (peko-protocol).
              - 'peko-rs/protocol/**'
              - '.github/workflows/desktop.yml'
            contract:
              - 'desktop/src-tauri/src/ipc/**'
              - 'desktop/scripts/check-ipc-contract.py'
              - 'peko-rs/core/src/ipc/fixtures/**'
              - '.github/workflows/desktop.yml'

  # ─────────────────────────────────────────────────────────────────
  # 1. Frontend — TypeScript type check, lint, build, unit tests
  # ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npx vitest run --reporter=verbose

  # ─────────────────────────────────────────────────────────────────
  # IPC contract — every request the desktop sends matches the
  # runtime's fixture (the runtime decodes that fixture in its own unit
  # tests), checked against the runtime in the same commit.
  # ─────────────────────────────────────────────────────────────────
  ipc-contract:
    name: IPC contract
    needs: changes
    if: needs.changes.outputs.contract == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check desktop requests against the runtime fixture
        run: python3 -I desktop/scripts/check-ipc-contract.py .

  # ─────────────────────────────────────────────────────────────────
  # 2. Rust — fmt, clippy, check, test (Linux)
  # ─────────────────────────────────────────────────────────────────
  rust-linux:
    name: Rust (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: tauri-rust

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Tauri's build script validates `bundle.externalBin` paths exist
      # at compile time (clippy/check, not just `tauri build`). CI does
      # not need a real peko runtime for these jobs — an empty stub at
      # the host-triple-suffixed path is enough to satisfy the check.
      # The real binary only matters for `tauri build`/release.yml.
      # The desktop bundles `peko-daemon` (the long-running engine),
      # NOT the `peko` CLI — see `src-tauri/tauri.conf.json` and
      # `scripts/fetch-peko-sidecar.sh`.
      - name: Stub sidecar binary for Tauri build
        run: |
          TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p binaries
          touch "binaries/peko-daemon-${TRIPLE}"
          echo "Stubbed binaries/peko-daemon-${TRIPLE}"

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check

      - name: Run Rust unit tests
        run: cargo test --lib -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # 3. Rust — check & test (Windows)
  # ─────────────────────────────────────────────────────────────────
  rust-windows:
    name: Rust (Windows)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: tauri-rust-win

      # See Rust (Linux) for rationale; same stub needed for Tauri's
      # build-script validation of `bundle.externalBin`. Tauri's
      # Windows manifest expects `.exe` suffix on externalBin paths.
      # The desktop bundles `peko-daemon` (the long-running engine),
      # NOT the `peko` CLI.
      - name: Stub sidecar binary for Tauri build
        run: |
          $line = rustc -vV | Where-Object { $_ -match '^host:' }
          if ($line -match '^host:\s+(\S+)') { $TRIPLE = $matches[1] }
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          New-Item -ItemType File -Force -Path "binaries/peko-daemon-$TRIPLE.exe" | Out-Null
          Write-Host "Stubbed binaries/peko-daemon-$TRIPLE.exe"

      # Windows-only code (the named-pipe transport, its probe) has
      # cfg branches Linux and macOS never compile.
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The test binary used to die at startup with
      # STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139): Tauri's dialogs link
      # comctl32's TaskDialogIndirect, which needs the Common Controls v6
      # manifest that tauri-build embedded in the app binary only.
      # `build.rs` now embeds it in every binary, the tests included.
      - name: Run Rust unit tests
        run: cargo test --lib

  # ─────────────────────────────────────────────────────────────────
  # 4. Rust — check & test (macOS)
  # ─────────────────────────────────────────────────────────────────
  rust-macos:
    name: Rust (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: tauri-rust-macos

      # See Rust (Linux) for rationale; same stub needed for Tauri's
      # build-script validation of `bundle.externalBin`. Apple Silicon
      # runners currently report aarch64-apple-darwin. The desktop
      # bundles `peko-daemon` (the long-running engine), NOT the
      # `peko` CLI.
      - name: Stub sidecar binary for Tauri build
        run: |
          TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p binaries
          touch "binaries/peko-daemon-${TRIPLE}"
          echo "Stubbed binaries/peko-daemon-${TRIPLE}"

      - name: Cargo check
        run: cargo check

      - name: Run Rust unit tests
        run: cargo test --lib -- --nocapture

  # ─────────────────────────────────────────────────────────────────
  # 5. Security audit
  # ─────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: |
          # `audit.toml` is searched starting from the working directory
          # and walking ancestors. It correctly suppresses the
          # `unic-*` and `glib` warnings, but newer versions of
          # `cargo-audit` (≥0.21) appear to require `--ignore` for
          # the vulnerability (RUSTSEC-2026-0185 quinn-proto) class.
          # The CLI flag is a belt-and-suspenders fallback that
          # matches the entries in `desktop/audit.toml`.
          #
          # When any of these advisories are resolved upstream, drop
          # the matching `--ignore` from this list AND from
          # `audit.toml` in the same commit.
          cargo audit --ignore RUSTSEC-2025-0075 \
                      --ignore RUSTSEC-2025-0080 \
                      --ignore RUSTSEC-2025-0098 \
                      --ignore RUSTSEC-2025-0100 \
                      --ignore RUSTSEC-2024-0429 \
                      --ignore RUSTSEC-2024-0412 \
                      --ignore RUSTSEC-2024-0413 \
                      --ignore RUSTSEC-2024-0416 \
                      --ignore RUSTSEC-2024-0418 \
                      --ignore RUSTSEC-2026-0185 \
                      --ignore RUSTSEC-2026-0186 \
                      --ignore RUSTSEC-2026-0190 \
                      --ignore RUSTSEC-2026-0194 \
                      --ignore RUSTSEC-2026-0195 \
                      --ignore RUSTSEC-2026-0204

      - name: Audit npm dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: desktop
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: desktop/.trivyignore
