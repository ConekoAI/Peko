[package]
name = "peko-auth"
version = "0.8.1"
edition = "2021"
authors = ["Peko <peko@coneko.ai>"]
description = "Authentication and authorization (Phase 4 of the post-migration cleanup). Owns the canonical auth domain: ApiKey/ApiKeyStore, CallerContext, JwtValidator, RateLimiter, Permission, Resource, Action, AuthError, plus the Exposure enum lifted from principal/config. Trait ports (RuntimePaths, PrincipalResourceView) abstract root-only deps so peko-auth stays a leaf crate. Re-exports Subject from peko-subject for ergonomic access."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ConekoAI/Peko"

[dependencies]
# ADR-121 D6: the IPC JSON Schema, only with `--features schema`.
schemars = { version = "1", optional = true, features = ["chrono04"] }
peko-subject = { path = "../subject" }

# Crypto / JWT
ed25519-dalek = "2.1"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
base64 = "0.23"
rand = "0.8"
argon2 = "0.5"
sha2 = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Time + error
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

# Async + HTTP
tokio = { version = "1.35", features = ["rt", "fs", "sync", "macros", "io-util", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
rsa = "0.9"

[features]
# ADR-121 D6: derive JSON Schemas for the IPC wire types.
schema = ["dep:schemars", "peko-subject/schema"]
