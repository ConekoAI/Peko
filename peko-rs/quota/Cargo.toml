[package]
name = "peko-quota"
version = "0.7.1"
edition = "2021"
authors = ["Peko <peko@coneko.ai>"]
description = "Per-principal token quota meter (F18) — owns QuotaMeter, QuotaScope, QuotaState, QuotaConfig, QuotaError"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ConekoAI/Peko"

[dependencies]
# ADR-121 D6: the IPC JSON Schema, only with `--features schema`.
schemars = { version = "1", optional = true, features = ["chrono04"] }
# Workspace member owning the canonical TokenUsage contract.
peko-message = { path = "../message" }
# Time / calendar arithmetic for cycle boundaries.
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# tokio for `task_local!` (QuotaScope), async file persistence
# (QuotaState), and `time::sleep` in tests. `rt` enables the
# single-threaded runtime required by the Scope tests.
tokio = { version = "1.35", features = ["rt", "macros", "fs", "io-util", "time", "sync"] }
# Error derive + logging used in QuotaMeter / QuotaScope.
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
toml = "1.1"
tempfile = "3.10"

[features]
# ADR-121 D6: derive JSON Schemas for the IPC wire types.
schema = ["dep:schemars"]
