[package]
name = "peko-protocol"
version = "0.8.0"
edition = "2021"
authors = ["Peko <peko@coneko.ai"]
description = "Peko IPC + tunnel wire-shape contracts. Phase 11a ships the leaf-level auth envelope types and shared constants; subsequent Phase 11 commits lift the rest of `src/ipc/packet.rs` and `src/tunnel/protocol.rs` as needed."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ConekoAI/Peko"

[dependencies]
# ADR-121 D6: the IPC JSON Schema, only with `--features schema`.
schemars = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# ADR-121 D6: derive JSON Schemas for the IPC wire types.
schema = ["dep:schemars"]
