[package]
name = "peko-subject"
version = "0.8.1"
edition = "2021"
authors = ["Peko <peko@coneko.ai>"]
description = "Canonical actor type and identifier newtypes (ADR-041) — pure value layer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ConekoAI/Peko"

[dependencies]
# ADR-121 D6: the IPC JSON Schema, only with `--features schema`.
schemars = { version = "1", optional = true, features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.7", features = ["v4"] }

[dev-dependencies]
toml = "1.1"
serde_json = "1"

[features]
# ADR-121 D6: derive JSON Schemas for the IPC wire types.
schema = ["dep:schemars"]
